<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found — Emre Yılmaz</title>
    <meta name="description" content="The page you are looking for does not exist or has been moved.">
    <meta name="robots" content="noindex, follow">

    <meta name="theme-color" content="#0f1217" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f8f9fb" media="(prefers-color-scheme: light)">

    <!-- Shared head: fonts, theme (applied before paint to avoid a flash), tokens + layout, chrome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script>
        (function () {
            var query = '(prefers-color-scheme: dark)';
            var dark;
            try {
                var saved = localStorage.getItem('theme');
                dark = saved ? saved === 'dark' : window.matchMedia(query).matches;
            } catch (error) {
                dark = window.matchMedia(query).matches;
            }
            if (dark) document.documentElement.classList.add('dark');
        })();
    </script>
    <link rel="stylesheet" href="/components/theme.css">
    <link rel="stylesheet" href="/components/site.css">
    <script type="module" src="/components/ui.js"></script>
</head>

<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <emre-header active-page="none"></emre-header>

    <main id="main-content" class="page">
        <section class="not-found" aria-labelledby="not-found-heading">
            <span class="label">404</span>
            <h1 id="not-found-heading">Page not found.</h1>
            <p class="lede">This page doesn't exist, or it has moved.</p>
            <div class="actions">
                <a class="btn btn-primary" href="/">Back to home</a>
                <a href="/projects/">Projects</a>
                <a href="https://blog.emre.xyz">Blog</a>
                <a href="https://news.emre.xyz">News</a>
            </div>
        </section>
    </main>

    <emre-footer></emre-footer>
</body>

</html>
